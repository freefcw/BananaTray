name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主路径快速门禁：不安装系统依赖、不安装 toolchain，只检查 GPUI-free lib surface。
  linux-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show bundled Rust tools
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Forbid GPUI glob imports
        run: ./scripts/check-gpui-imports.sh

      - name: Forbid provider secret byte slicing
        run: ./scripts/check-provider-secret-slicing.sh

      - name: Keep release panic profile on unwind
        run: ./scripts/check-release-panic-profile.sh

      - name: Install GJS integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs dbus gettext

      # node 是扩展语法/D-Bus 契约/单元测试校验的硬依赖，显式安装形成契约
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # check-gnome-extension.sh 在 gjs + dbus-run-session 可用时自动附带
      # GJS 真实 D-Bus 集成测试（scripts/test-gnome-extension-gjs.sh）。
      # GNOME_CHECK_STRICT=1：node/gettext/gjs 任一缺失即失败，
      # 避免工具缺失导致校验被跳过后仍 "passed" 的假阳性。
      - name: Check GNOME Shell Extension (incl. GJS D-Bus integration test)
        env:
          GNOME_CHECK_STRICT: "1"
        run: ./scripts/check-gnome-extension.sh

      - name: Test GNOME packaging contracts
        run: ./scripts/test-gnome-packaging-contracts.sh

      - name: Test packaging scripts
        run: ./scripts/test-packaging-scripts.sh

      - name: Test custom provider YAML migration
        run: python3 -m unittest scripts/test_migrate_custom_provider_yaml.py

      - name: Run fast lib clippy
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Run core tests
        run: cargo test --lib --no-default-features
