# OpenCode Provider（自定义 YAML 的 placeholder 示例）
#
# 演示 placeholder source 能力；内置 OpenCode 已升级为 Monitorable（见 src/providers/opencode/）。
# - check_availability 只检测 CLI 是否存在
# - refresh 直接返回 unavailable 错误
# - 无需 parser 配置
id: "opencode:cli"
schema_version: 2
metadata:
  display_name: "OpenCode"
  brand_name: "OpenCode"
  icon: "src/icons/provider-opencode.svg"
  dashboard_url: ""
  account_hint: "OpenCode account"
  source_label: "opencode cli"
plan:
  mode: first_success
  steps:
    - name: "default"
      required: true
      availability:
        type: cli_exists
        value: "opencode"
      source:
        type: placeholder
        reason: "Example placeholder only; built-in OpenCode uses the Go usage API"
